workflows:
  default_ios_workflow:
    name: Default iOS Workflow
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      node: 22.12.0
      xcode: 16.4
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Clean Pod cache
        script: |
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf .symlinks/
          rm -rf ios/.symlinks/
          pod cache clean --all
          rm -rf ~/.cocoapods/repos/cocoapods
          rm -rf ~/Library/Developer/Xcode/DerivedData/*CoffeeLoyalty*
      - name: Update pod repositories
        script: |
          pod repo update --silent
      - name: Pod install
        script: |
          cd ios && EXPO_USE_SOURCE=1 pod install --repo-update --verbose && cd ..
          if [ ! -f ios/Podfile.lock ]; then
            echo "ERROR: Podfile.lock not created!"
            exit 1
          fi
      - name: Build
        script: |
          set -o pipefail
          echo "Starting Xcode build at $(date)"
          
          # Verify ExpoModulesJSI pod status
          if [ -f "ios/Pods/Pods.xcodeproj/project.pbxproj" ]; then
            echo "Checking ExpoModulesJSI target..."
            grep -i "ExpoModulesJSI" ios/Pods/Pods.xcodeproj/project.pbxproj | head -5
          fi
          
          xcodebuild -workspace ios/CoffeeLoyalty.xcworkspace \
            -scheme CoffeeLoyalty \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            OTHER_SWIFT_FLAGS="-suppress-warnings" \
            -derivedDataPath ios/build \
            -disablePackageRepositoryCache \
            build 2>&1 | tee /tmp/ios-build.log
          build_status=${PIPESTATUS[0]}
          if [[ "$build_status" -ne 0 ]]; then
            echo "========== Build FAILED =========="
            echo "Looking for package resolution errors..."
            grep -E "Could not resolve package|PhaseScriptExecution.*ExpoModulesJSI" /tmp/ios-build.log | head -10 || true
          else
            echo "========== Build SUCCEEDED at $(date) =========="
          fi
          exit "$build_status"
    artifacts:
      - build/**/*.app
    publishing:
      email:
        recipients:
          - orhnoguzhn@gmail.com
