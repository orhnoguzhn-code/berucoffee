workflows:
  default_ios_workflow:
    name: Default iOS Workflow
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      node: 22.23.1
      xcode: 26.6
      cocoapods: 1.16.2
    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm ci
      - name: Clean CocoaPods workspace
        script: |
          set -e
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ~/Library/Caches/CocoaPods
          rm -rf ~/Library/Developer/Xcode/DerivedData
          pod cache clean RCT-Folly --all || true
      - name: Pod install
        script: |
          set -e
          cd ios
          pod deintegrate || true
          rm -rf Pods Podfile.lock
          pod repo update
          pod install --repo-update
          cd ..
      - name: Build
        script: |
          set -o pipefail
          xcodebuild -workspace ios/CoffeeLoyalty.xcworkspace \
            -scheme CoffeeLoyalty \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/ios-build.log
          build_status=${PIPESTATUS[0]}
          if [[ "$build_status" -ne 0 ]]; then
            echo "========== Xcode failure summary =========="
            grep -n -E "error:|fatal error:|clang: error|SwiftCompile|CompileSwift|CompileC|PhaseScriptExecution|Ld |linker command failed|Undefined symbols|The following build commands failed|BUILD FAILED|Command .* failed" /tmp/ios-build.log | tail -120 || true
            echo "========== Last 120 build-log lines =========="
            tail -120 /tmp/ios-build.log || true
          fi
          exit "$build_status"
    artifacts:
      - build/**/*.app
    publishing:
      email:
        recipients:
          - orhnoguzhn@gmail.com
