workflows:
  default_ios_workflow:
    name: Default iOS Workflow
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      node: 22.12.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Clean Pod cache
        script: |
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
      - name: Pod install
        script: |
          cd ios && pod install --repo-update && cd ..
      - name: Build
        script: |
          set -o pipefail
          xcodebuild -workspace ios/CoffeeLoyalty.xcworkspace \
            -scheme CoffeeLoyalty \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -verbose \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/ios-build.log
          build_status=${PIPESTATUS[0]}
          if [[ "$build_status" -ne 0 ]]; then
            echo "========== Xcode compiler errors =========="
            grep -E "(^| )error:|fatal error:" /tmp/ios-build.log | head -20 || true
            tgt=$(grep -E "(^| )error:" /tmp/ios-build.log | grep -oE "in target '[^']+'" | head -1 | sed "s/in target '//;s/'//")
            echo "failing target: $tgt"
            echo "========== Failed compile command (search paths) =========="
            grep -E "\.resp|common-args" /tmp/ios-build.log | grep -e "-c /" | tail -3 || true
            echo "========== Response file (-I flags) =========="
            resp=$(grep -oE "@[^ ]*${tgt}\.build/[^ ]*common-args\.resp" /tmp/ios-build.log | head -1 | sed 's/^@//')
            echo "resp: $resp"
            if [ -n "$resp" ]; then
              tr ' ' '\n' < "$resp" | grep -E '^-I' | head -60 || true
            fi
            echo "========== Header farm for failing pod =========="
            find "ios/Pods/Headers/Public/$tgt" -maxdepth 3 2>/dev/null | head -20 || true
            echo "========== Real source header dirs for failing pod =========="
            find "ios/Pods/$tgt" -name '*.h' 2>/dev/null | sed 's|/[^/]*$||' | sort -u | head -30 || true
            echo "========== Podfile-derived paths (pod install log) =========="
            grep "berucoffee.*$tgt" /tmp/ios-build.log 2>/dev/null | head -20 || true
          fi
          exit "$build_status"
    artifacts:
      - build/**/*.app
    publishing:
      email:
        recipients:
          - orhnoguzhn@gmail.com
