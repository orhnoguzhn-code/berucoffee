workflows:
  ios-build:
    name: React Native iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: 18.16.0
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Install iOS dependencies
        script: |
          cd ios
          pod install
          cd ..
      - name: Build and archive
        script: |
          xcodebuild -workspace ios/CoffeeLoyalty.xcworkspace \
            -scheme CoffeeLoyalty \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -archivePath build/CoffeeLoyalty.xcarchive \
            archive
    artifacts:
      - build/CoffeeLoyalty.xcarchive/**/*
      - build/DerivedData/**/*
    publishing:
      email:
        recipients:
          - orhnoguzhn@gmail.com
        notify:
          success: true
          failure: true
  
  ios-build-ipa:
    name: React Native iOS Build and Export IPA
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: 18.16.0
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Install iOS dependencies
        script: |
          cd ios
          pod install
          cd ..
      - name: Build and archive
        script: |
          xcodebuild -workspace ios/CoffeeLoyalty.xcworkspace \
            -scheme CoffeeLoyalty \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -archivePath build/CoffeeLoyalty.xcarchive \
            archive
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/CoffeeLoyalty.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ipa
    artifacts:
      - build/ipa/**/*.ipa
      - build/CoffeeLoyalty.xcarchive/**/*
    publishing:
      email:
        recipients:
          - orhnoguzhn@gmail.com
        notify:
          success: true
          failure: true
