workflows:
  ios-build:
    name: React Native iOS Build
    instance_type: mac_mini_m1
    environment:
      node: 18.16.0
      xcode: latest
    scripts:
      - name: Checkout code
        script: |
          ls -la
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
          cd ..
      - name: Build iOS app
        script: |
          xcodebuild -workspace ios/CoffeeLoyalty.xcworkspace \
            -scheme CoffeeLoyalty \
            -configuration Release \
            -derivedDataPath build
    artifacts:
      - build/Build/Products/**/*.app
    publishing:
      email:
        recipients:
          - orhnoguzhn@gmail.com
        notify:
          success: true
          failure: true
