workflows:
  default_ios_workflow:
    name: Default iOS Workflow
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      node: 18.16.0
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Clean Pod cache
        script: |
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
      - name: Pod install
        script: |
          cd ios && pod install --repo-update && cd ..
      - name: Build
        script: |
          set -o pipefail
          npx react-native run-ios \
            --mode Release \
            --scheme CoffeeLoyalty \
            --destination "generic/platform=iOS" \
            --no-packager \
            --extra-params "CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO" \
            --verbose 2>&1 | tee /tmp/ios-build.log
          build_status=${PIPESTATUS[0]}
          if [[ "$build_status" -ne 0 ]]; then
            echo "========== Xcode compiler errors =========="
            grep -E "(^| )error:|fatal error:" /tmp/ios-build.log || true
          fi
          exit "$build_status"
    artifacts:
      - build/**/*.app
    publishing:
      email:
        recipients:
          - orhnoguzhn@gmail.com
