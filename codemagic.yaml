workflows:
  default_ios_workflow:
    name: Default iOS Workflow
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      node: 18.16.0
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Clean Pod cache
        script: |
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
      - name: Pod install
        script: |
          cd ios && pod install --repo-update && cd ..
      - name: Build
        script: |
          xcodebuild -workspace ios/CoffeeLoyalty.xcworkspace \
            -scheme CoffeeLoyalty \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
    artifacts:
      - build/**/*.app
    publishing:
      email:
        recipients:
          - orhnoguzhn@gmail.com
