workflows:
  default_ios_workflow:
    name: Default iOS Workflow
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      node: 18.16.0
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Pod install
        script: |
          cd ios && pod install && cd ..
      - name: Build
        script: |
          xcodebuild -workspace ios/CoffeeLoyalty.xcworkspace \
            -scheme CoffeeLoyalty \
            -configuration Release \
            build
    artifacts:
      - build/**/*.app
    publishing:
      email:
        recipients:
          - orhnoguzhn@gmail.com
