workflows:
  default_ios_workflow:
    name: Default iOS Workflow
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      node: 22.12.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Clean Pod cache
        script: |
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
      - name: Pod install
        script: |
          set -o pipefail
          cd ios && pod install --repo-update 2>&1 | tee /tmp/pod-install.log && cd ..
      - name: Build
        script: |
          set -o pipefail
          xcodebuild -workspace ios/CoffeeLoyalty.xcworkspace \
            -scheme CoffeeLoyalty \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -verbose \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/ios-build.log
          build_status=${PIPESTATUS[0]}
          if [[ "$build_status" -ne 0 ]]; then
            echo "========== Xcode compiler errors =========="
            grep -E "(^| )error:|fatal error:" /tmp/ios-build.log | head -30 || true
            tgt=$(awk '/build commands failed:/{f=1} f' /tmp/ios-build.log | grep -oE "in target '[^']+'" | head -1 | sed "s/in target '//;s/'//")
            if [ -z "$tgt" ]; then
              tgt=$(grep -E "(^| )error:|fatal error:" /tmp/ios-build.log | grep -oE "in target '[^']+'" | head -1 | sed "s/in target '//;s/'//")
            fi
            echo "failing target: $tgt"
            echo "========== Failed compile command (search paths) =========="
            grep -E "\.resp|common-args" /tmp/ios-build.log | grep -e "-c /" | tail -3 || true
            echo "========== Response file (-I flags) =========="
            resp=$(grep -oE "@[^ ]*${tgt}\.build/[^ ]*common-args\.resp" /tmp/ios-build.log | head -1 | sed 's/^@//')
            echo "resp: $resp"
            if [ -n "$resp" ]; then
              tr ' ' '\n' < "$resp" | grep -E '^-I' | head -80 || true
              echo "========== Shadowing header dirs in resp (-I) =========="
              tr ' ' '\n' < "$resp" | grep '^-I' | sed 's/^-I//' | while read -r d; do
                d=$(echo "$d" | sed 's/"//g')
                for h in stdio.h stdlib.h string.h wchar.h math.h time.h locale.h signal.h; do
                  if [ -f "$d/$h" ]; then
                    echo "SHADOW DIR ($h): $d"
                    break
                  fi
                done
              done
              echo "========== Shadowing header dirs in resp (-isystem/-idirafter) =========="
              tr ' ' '\n' < "$resp" | grep -E '^-isystem|^-idirafter' | sed -E 's/^-(isystem|idirafter)//' | while read -r d; do
                d=$(echo "$d" | sed 's/"//g')
                for h in stdio.h stdlib.h string.h wchar.h math.h time.h locale.h signal.h; do
                  if [ -f "$d/$h" ]; then
                    echo "ISYSTEM SHADOW DIR ($h): $d"
                    break
                  fi
                done
              done
              echo "========== All -isystem flags =========="
              tr ' ' '\n' < "$resp" | grep -E '^-isystem|^-idirafter' || true
              echo "========== math.h hunt =========="
              ls -la /usr/local/include/math.h 2>/dev/null || echo "no /usr/local/include/math.h"
              find /Users/builder/clone/ios/Pods/ReactNativeDependencies -maxdepth 4 -name 'math.h' 2>/dev/null | head -20
              find /Users/builder/clone/ios/Pods/ReactNativeDependencies -maxdepth 4 -name 'stdio.h' -o -maxdepth 4 -name 'stdlib.h' 2>/dev/null | head -20
            fi
            echo "========== Header farm for failing pod =========="
            find "ios/Pods/Headers/Public/$tgt" -maxdepth 3 2>/dev/null | head -20 || true
            echo "========== duplicate interface context =========="
            grep -B12 -A2 "duplicate interface definition" /tmp/ios-build.log | head -80 || true
            echo "========== FIROptions.h copies =========="
            find ios/Pods -name 'FIROptions.h' 2>/dev/null
            find /Users/builder/Library/Developer/Xcode/DerivedData -name 'FIROptions.h' -path '*FirebaseCore*' 2>/dev/null | head -10
            echo "========== Real source header dirs for failing pod =========="
            find "ios/Pods/$tgt" -name '*.h' 2>/dev/null | sed 's|/[^/]*$||' | sort -u | head -30 || true
            echo "========== @import lines in failing pod sources =========="
            grep -rn "@import" "ios/Pods/$tgt" --include="*.h" --include="*.m" --include="*.mm" 2>/dev/null | head -20 || true
            echo "========== FirebaseCoreInternal hunt =========="
            find ios/Pods -maxdepth 3 -name 'FirebaseCoreInternal.h' 2>/dev/null
            ls ios/Pods 2>/dev/null | grep -i 'firebase\|internal' | head -20
            echo "========== Podfile-derived paths (pod install log) =========="
            grep -E "\[berucoffee\] ${tgt} " /tmp/pod-install.log 2>/dev/null | head -4 || true
            echo "========== ERROR SUMMARY (reprinted at end) =========="
            grep -E "(^| )error:|fatal error:" /tmp/ios-build.log | head -30 || true
            echo "failing target: $tgt"
            echo "first failing command:"
            awk '/build commands failed:/{f=1} f && /\.o /{print; exit}' /tmp/ios-build.log | head -1 || true
          fi
          exit "$build_status"
    artifacts:
      - build/**/*.app
    publishing:
      email:
        recipients:
          - orhnoguzhn@gmail.com
