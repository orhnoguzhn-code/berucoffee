name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build CoffeeLoyalty
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select compatible Xcode
        run: |
          set -e
          DEVELOPER_DIR="/Applications/Xcode_16.4.app"
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "Xcode 16.4 is not installed on this runner."
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          echo "Using Xcode at: $DEVELOPER_DIR"
          sudo xcode-select -switch "$DEVELOPER_DIR/Contents/Developer"
          export DEVELOPER_DIR="$DEVELOPER_DIR/Contents/Developer"
          xcodebuild -version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Align Expo JSI Swift tools version
        run: |
          set -e
          pkg="node_modules/expo-modules-jsi/apple/Package.swift"
          if [ -f "$pkg" ]; then
            perl -0pi -e 's/swift-tools-version:\s*6\.2/swift-tools-version: 6.1/' "$pkg"
            grep -q 'swift-tools-version: 6.1' "$pkg"
          else
            echo "Expo JSI package not found: $pkg"
            exit 1
          fi

      - name: Clean stale Pods and DerivedData
        run: |
          rm -rf ios/Pods ios/Podfile.lock ~/Library/Developer/Xcode/DerivedData/*

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: set -o pipefail && pod install --repo-update 2>&1 | tee ../pod-install.log

      - name: Verify RCT-Folly demangle patch
        run: |
          set -e
          file="ios/Pods/RCT-Folly/folly/Demangle.cpp"
          if [ ! -f "$file" ]; then
            echo "RCT-Folly Demangle.cpp not found: $file"
            exit 1
          fi
          if grep -q '#if false && __has_include(<demangle.h>)' "$file"; then
            echo "RCT-Folly demangle libiberty section successfully disabled."
          else
            echo "Expected RCT-Folly demangle patch was not applied."
            grep -n -E 'demangle.h|demangle_callbackref|cplus_demangle_v3_callback|DMGL_' "$file" | head -40 || true
            exit 1
          fi

      - name: Select available iPhone simulator
        id: simulator
        run: |
          set -e
          device=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 16/ {print $1; exit}' | xargs)
          if [ -z "$device" ]; then
            device=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $1; exit}' | xargs)
          fi
          if [ -z "$device" ]; then
            echo "No available iPhone simulator was found."
            exit 1
          fi
          echo "Using simulator: $device"
          echo "name=$device" >> "$GITHUB_OUTPUT"

      - name: Build for simulator
        run: |
          set -euo pipefail
          export DEVELOPER_DIR="/Applications/Xcode_16.4.app/Contents/Developer"
          xcodebuild build \
            -workspace ios/CoffeeLoyalty.xcworkspace \
            -scheme CoffeeLoyalty \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee xcodebuild.log

      - name: Diagnose build failure
        if: failure()
        run: |
          echo "========== ERROR SUMMARY =========="
          if [ -f xcodebuild.log ]; then
            grep -E "error:|fatal error:" xcodebuild.log | sort -u | head -40 || true
            echo "========== failing target =========="
            line=$(awk '/build commands failed:/{f=1} f && /\.o /{print; exit}' xcodebuild.log || true)
            echo "$line"
            tgt=$(echo "$line" | grep -oE "in target '[^']+'" | sed "s/in target '//;s/'//" | head -1 || true)
            echo "failing target: $tgt"
            if [ -n "$tgt" ]; then
              resp=$(grep -oE "@[^ ]*${tgt}\.build/[^ ]*common-args\.resp" xcodebuild.log | head -1 | sed 's/^@//' || true)
              echo "resp: $resp"
              if [ -n "$resp" ] && [ -f "$resp" ]; then
                echo "========== resp -I flags =========="
                tr ' ' '\n' < "$resp" | grep -E '^-I' | head -100 || true
              fi
            fi
          else
            echo "xcodebuild.log was not created; the failure occurred before the Xcode build step."
          fi

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          if-no-files-found: ignore
          path: |
            xcodebuild.log
            pod-install.log
