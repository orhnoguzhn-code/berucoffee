name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build CoffeeLoyalty
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Xcode 26.4+
        shell: bash
        run: |
          set -euo pipefail
          DEVELOPER_DIR=""
          for candidate in \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.4.app; do
            if [ -d "$candidate" ]; then
              DEVELOPER_DIR="$candidate/Contents/Developer"
              break
            fi
          done
          if [ -z "$DEVELOPER_DIR" ]; then
            echo "No Xcode 26.4+ installation was found on this runner."
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -switch "$DEVELOPER_DIR"
          export DEVELOPER_DIR
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          # package.json and package-lock.json have been edited during the Expo
          # upgrade. npm ci correctly refuses a stale lockfile, so regenerate the
          # lock resolution in CI before applying Expo's SDK-compatible versions.
          npm install --no-audit --no-fund
          npx expo install --fix
          echo "Resolved dependency tree:"
          npm ls expo expo-modules-jsi expo-modules-core react-native react --depth=0

      - name: Patch React Native 0.86 legacy imports
        shell: bash
        run: |
          set -euo pipefail
          base="node_modules/react-native/React/Base/RCTBridge.mm"
          test -f "$base"
          perl -0pi -e 's/#import "RCTInspectorDevServerHelper\.h"/#if RCT_ENABLE_INSPECTOR\n#import "..\/DevSupport\/RCTInspectorDevServerHelper.h"\n#endif/g' "$base"
          perl -0pi -e 's/#import "RCTDevLoadingViewProtocol\.h"/#import "..\/DevSupport\/RCTDevLoadingViewProtocol.h"/g' "$base"

      - name: Clean native build state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios/Pods ios/Podfile.lock
          rm -rf build/DerivedData
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          sudo gem install cocoapods -v 1.16.2 --no-document
          GEM_BIN="$(ruby -e 'puts Gem.bindir')"
          echo "${GEM_BIN}" >> "$GITHUB_PATH"
          export PATH="${GEM_BIN}:${PATH}"
          pod --version

      - name: Install CocoaPods dependencies
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          pod _1.16.2_ install --clean-install --repo-update

      - name: Verify ExpoModulesJSI patch
        shell: bash
        run: |
          set -euo pipefail
          scheduler="node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h"
          test -f "$scheduler"
          if grep -Eq 'SWIFT_RETURNS_(RETAINED|UNRETAINED)' "$scheduler"; then
            echo "RuntimeScheduler ownership annotations remain after Podfile patch."
            exit 1
          fi
          echo "ExpoModulesJSI RuntimeScheduler patch verified."

      - name: Verify Pods
        shell: bash
        run: |
          set -euo pipefail
          test -d ios/Pods
          test -f ios/Podfile.lock
          grep -E "React-RCTAppDelegate|RNFBApp|RNFBAuth|RNFBMessaging" ios/Podfile.lock || true

      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -e
          device=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 17/ {print $1; exit}' | xargs)
          if [ -z "$device" ]; then
            device=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 16/ {print $1; exit}' | xargs)
          fi
          if [ -z "$device" ]; then
            device=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $1; exit}' | xargs)
          fi
          test -n "$device"
          echo "Using simulator: $device"
          echo "name=$device" >> "$GITHUB_OUTPUT"

      - name: Build for simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace ios/CoffeeLoyalty.xcworkspace \
            -scheme CoffeeLoyalty \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          echo "========== XCODEBUILD EXIT CODE: ${status} =========="
          exit "${status}"

      - name: Diagnose build failure
        if: failure()
        shell: bash
        run: |
          echo "========== ERROR SUMMARY =========="
          if [ -f xcodebuild.log ]; then
            grep -E "error:|fatal error:" xcodebuild.log | sort -u | head -120 || true
          fi
          if [ -f ios/Podfile.lock ]; then
            echo "========== PODS =========="
            grep -E "React-RCTAppDelegate|RNFBApp|RNFBAuth|RNFBMessaging|expo-modules-jsi" ios/Podfile.lock || true
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          if-no-files-found: ignore
          path: |
            xcodebuild.log
            ios/Podfile.lock
