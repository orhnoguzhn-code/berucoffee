name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build CoffeeLoyalty
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select compatible Xcode
        run: |
          set -e
          DEVELOPER_DIR="/Applications/Xcode_16.4.app"
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "Xcode 16.4 is not installed on this runner."
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          echo "Using Xcode at: $DEVELOPER_DIR"
          sudo xcode-select -switch "$DEVELOPER_DIR/Contents/Developer"
          export DEVELOPER_DIR="$DEVELOPER_DIR/Contents/Developer"
          xcodebuild -version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Align Expo JSI Swift tools version
        run: |
          set -e
          pkg="node_modules/expo-modules-jsi/apple/Package.swift"
          if [ -f "$pkg" ]; then
            perl -0pi -e 's/swift-tools-version:\s*6\.2/swift-tools-version: 6.1/' "$pkg"
            grep -q 'swift-tools-version: 6.1' "$pkg"
          else
            echo "Expo JSI package not found: $pkg"
            exit 1
          fi

      - name: Clean stale Pods and DerivedData
        run: |
          set -euo pipefail
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf build/DerivedData
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          echo "Cleaned ios/Pods, ios/Podfile.lock, build/DerivedData and Xcode DerivedData."

      - name: Install pinned CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          sudo gem install cocoapods -v 1.16.2 --no-document
          hash -r
          pod_version="$(pod --version)"
          echo "CocoaPods version: ${pod_version}"
          test "${pod_version}" = "1.16.2"

      - name: Install CocoaPods dependencies
        working-directory: ios
        shell: bash
        run: |
          set -o pipefail
          echo "========== COCOAPODS ENVIRONMENT =========="
          ruby --version
          gem --version
          pod --version
          node --version
          npm --version
          xcodebuild -version
          echo "========== PODFILE =========="
          sed -n '1,280p' Podfile
          echo "========== POD INSTALL =========="
          pod install --repo-update --clean-install --verbose 2>&1 | tee ../pod-install.log
          status=${PIPESTATUS[0]}
          echo "========== POD INSTALL EXIT CODE: ${status} =========="
          if [ "${status}" -ne 0 ]; then
            echo "========== POD INSTALL ERROR SUMMARY =========="
            grep -n -E "(Error|ERROR|error:|NoMethodError|undefined method|Invalid|Could not|Unable|cannot|not found|Unable to find a specification)" ../pod-install.log | tail -n 120 || true
            echo "========== POD INSTALL LAST 300 LINES =========="
            tail -n 300 ../pod-install.log || true
            exit "${status}"
          fi

      - name: Verify Pods
        shell: bash
        run: |
          set -euxo pipefail
          test -d ios/Pods
          test -f ios/Podfile.lock
          echo "========== PODS VERIFIED =========="
          grep -E "^(  - React-Core|  - RCT-Folly|  - Firebase|  - GoogleMaps)" ios/Podfile.lock || true

      - name: Verify React-Core integration mode
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'React-Core.*framework' ios/Pods/Manifest.lock 2>/dev/null; then
            echo "React-Core unexpectedly resolved as a framework."
            exit 1
          fi
          echo "React-Core is configured as a static library."

      - name: Verify RCT-Folly demangle patch
        run: |
          set -e
          file="ios/Pods/RCT-Folly/folly/Demangle.cpp"
          if [ ! -f "$file" ]; then
            echo "RCT-Folly Demangle.cpp not found: $file"
            exit 1
          fi
          if grep -q '#if false && __has_include(<demangle.h>)' "$file"; then
            echo "RCT-Folly demangle libiberty section successfully disabled."
          else
            echo "Expected RCT-Folly demangle patch was not applied."
            grep -n -E 'demangle.h|demangle_callbackref|cplus_demangle_v3_callback|DMGL_' "$file" | head -40 || true
            exit 1
          fi

      - name: Select available iPhone simulator
        id: simulator
        run: |
          set -e
          device=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 16/ {print $1; exit}' | xargs)
          if [ -z "$device" ]; then
            device=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $1; exit}' | xargs)
          fi
          if [ -z "$device" ]; then
            echo "No available iPhone simulator was found."
            exit 1
          fi
          echo "Using simulator: $device"
          echo "name=$device" >> "$GITHUB_OUTPUT"

      - name: Build for simulator
        run: |
          set -o pipefail
          export DEVELOPER_DIR="/Applications/Xcode_16.4.app/Contents/Developer"
          xcodebuild build \
            -workspace ios/CoffeeLoyalty.xcworkspace \
            -scheme CoffeeLoyalty \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          echo "========== XCODEBUILD EXIT CODE: ${status} =========="
          exit "${status}"

      - name: Diagnose build failure
        if: failure()
        run: |
          echo "========== ERROR SUMMARY =========="
          if [ -f xcodebuild.log ]; then
            grep -E "error:|fatal error:" xcodebuild.log | sort -u | head -80 || true
            echo "========== failing target =========="
            grep -n "error:" xcodebuild.log | tail -50 || true
          else
            echo "xcodebuild.log was not created; the failure occurred before the Xcode build step."
          fi
          if [ -f pod-install.log ]; then
            echo "========== POD INSTALL SUMMARY =========="
            grep -n -E "(Error|ERROR|error:|NoMethodError|undefined method|Invalid|Could not|Unable|cannot|not found)" pod-install.log | tail -100 || true
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          if-no-files-found: ignore
          path: |
            xcodebuild.log
            pod-install.log
            ios/Podfile.lock
