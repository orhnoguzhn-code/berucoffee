name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build CoffeeLoyalty
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select compatible Xcode
        run: |
          DEVELOPER_DIR=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$DEVELOPER_DIR" ]; then
            echo "No Xcode installation found on the runner."
            exit 1
          fi
          echo "Using Xcode at: $DEVELOPER_DIR"
          sudo xcode-select -switch "$DEVELOPER_DIR/Contents/Developer"
          xcodebuild -version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Align Expo JSI Swift tools version
        run: |
          set -e
          pkg="node_modules/expo-modules-jsi/apple/Package.swift"
          if [ -f "$pkg" ]; then
            perl -0pi -e 's/swift-tools-version:\s*6\.2/swift-tools-version: 6.1/' "$pkg"
            grep -q 'swift-tools-version: 6.1' "$pkg"
          else
            echo "Expo JSI package not found: $pkg"
            exit 1
          fi

      - name: Clean stale Pods and DerivedData
        run: |
          rm -rf ios/Pods ios/Podfile.lock ~/Library/Developer/Xcode/DerivedData/*

      - name: Isolate GTMSessionFetcher source headers
        run: |
          set -e
          ruby <<'RUBY'
          path = 'ios/Podfile'
          text = File.read(path)
          marker = "            # Xcode emits HEADER_SEARCH_PATHS -I flags and the -F framework\n"
          patch = <<~'PATCH'
            # GTMSessionFetcher is consumed by FirebaseAuth through its generated module.
            # Do not expose the pod's source headers to consumer targets: with static
            # frameworks Xcode can otherwise load both the source header and the generated
            # framework header, producing duplicate protocol/class declarations.
            unless target.name == 'GTMSessionFetcher'
              dirs.reject! { |d| d.include?('/GTMSessionFetcher') || d.include?('\\GTMSessionFetcher') }
            end
          PATCH
          unless text.include?('GTMSessionFetcher is consumed by FirebaseAuth')
            updated = text.sub(marker, patch + marker)
            raise 'Could not locate Podfile header-search-path marker' if updated == text
            File.write(path, updated)
          end
          RUBY

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: set -o pipefail && pod install --repo-update 2>&1 | tee ../pod-install.log

      - name: Select available iPhone simulator
        id: simulator
        run: |
          device=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $1; exit}' | xargs)
          if [ -z "$device" ]; then
            echo "No available iPhone simulator was found."
            exit 1
          fi
          echo "Using simulator: $device"
          echo "name=$device" >> "$GITHUB_OUTPUT"

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace ios/CoffeeLoyalty.xcworkspace \
            -scheme CoffeeLoyalty \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee xcodebuild.log

      - name: Diagnose build failure
        if: failure()
        run: |
          echo "========== ERROR SUMMARY =========="
          grep -E "error:|fatal error:" xcodebuild.log | sort -u | head -40 || true
          echo "========== failing target =========="
          line=$(awk '/build commands failed:/{f=1} f && /\.o /{print; exit}' xcodebuild.log)
          echo "$line"
          tgt=$(echo "$line" | grep -oE "in target '[^']+'" | sed "s/in target '//;s/'//" | head -1)
          echo "failing target: $tgt"
          if [ -n "$tgt" ]; then
            resp=$(grep -oE "@[^ ]*${tgt}\.build/[^ ]*common-args\.resp" xcodebuild.log | head -1 | sed 's/^@//')
            echo "resp: $resp"
            if [ -n "$resp" ]; then
              echo "========== resp -I flags =========="
              tr ' ' '\n' < "$resp" | grep -E '^-I' | head -100 || true
            fi
          fi

      - name: Upload Xcode build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            xcodebuild.log
            pod-install.log