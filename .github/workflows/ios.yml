name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build CoffeeLoyalty
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select compatible Xcode
        run: |
          set -euo pipefail
          DEVELOPER_DIR="/Applications/Xcode_16.4.app"
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "Xcode 16.4 is not installed on this runner."
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -switch "$DEVELOPER_DIR/Contents/Developer"
          export DEVELOPER_DIR="$DEVELOPER_DIR/Contents/Developer"
          xcodebuild -version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Patch React Native legacy imports before CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          base="node_modules/react-native/React/Base/RCTBridge.mm"
          test -f "$base"
          perl -0pi -e 's/#import "RCTInspectorDevServerHelper\.h"/#if RCT_ENABLE_INSPECTOR\n#import "..\/DevSupport\/RCTInspectorDevServerHelper.h"\n#endif/g' "$base"
          perl -0pi -e 's/#import "RCTDevLoadingViewProtocol\.h"/#import "..\/DevSupport\/RCTDevLoadingViewProtocol.h"/g' "$base"
          grep -n -E 'RCTInspectorDevServerHelper|RCTDevLoadingViewProtocol' "$base"

      - name: Align Expo JSI Swift tools version
        run: |
          set -e
          pkg="node_modules/expo-modules-jsi/apple/Package.swift"
          if [ -f "$pkg" ]; then
            perl -0pi -e 's/swift-tools-version:\s*6\.2/swift-tools-version: 6.1/' "$pkg"
            grep -q 'swift-tools-version: 6.1' "$pkg"
          else
            echo "Expo JSI package not found: $pkg"
            exit 1
          fi

      - name: Clean stale Pods and DerivedData
        run: |
          set -euo pipefail
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf build/DerivedData
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Install pinned CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          sudo gem install cocoapods -v 1.16.2 --no-document
          GEM_BIN="$(ruby -e 'puts Gem.bindir')"
          export PATH="${GEM_BIN}:/usr/local/bin:/opt/homebrew/bin:${PATH}"
          hash -r
          echo "RubyGems bin: ${GEM_BIN}"
          echo "pod executable: $(command -v pod)"
          pod_version="$(pod _1.16.2_ --version)"
          echo "CocoaPods selected version: ${pod_version}"
          test "${pod_version}" = "1.16.2"

      - name: Install CocoaPods dependencies
        working-directory: ios
        shell: bash
        run: |
          set -o pipefail
          GEM_BIN="$(ruby -e 'puts Gem.bindir')"
          export PATH="${GEM_BIN}:/usr/local/bin:/opt/homebrew/bin:${PATH}"
          hash -r
          echo "========== COCOAPODS ENVIRONMENT =========="
          ruby --version
          gem --version
          echo "pod executable: $(command -v pod)"
          echo "CocoaPods version: $(pod _1.16.2_ --version)"
          node --version
          npm --version
          xcodebuild -version
          echo "========== PODFILE =========="
          sed -n '1,320p' Podfile
          echo "========== POD INSTALL =========="
          install_status=1
          for attempt in 1 2; do
            echo "========== POD INSTALL ATTEMPT ${attempt}/2 =========="
            if pod _1.16.2_ install --clean-install --verbose 2>&1 | tee "../pod-install-${attempt}.log"; then
              install_status=0
              cp "../pod-install-${attempt}.log" ../pod-install.log
              break
            fi
            install_status=${PIPESTATUS[0]}
            cp "../pod-install-${attempt}.log" ../pod-install.log
            echo "CocoaPods install attempt ${attempt} failed with status ${install_status}."
            if [ "${attempt}" -lt 2 ]; then
              echo "Retrying after transient CDN/network failure..."
              sleep 5
            fi
          done

          echo "========== POD INSTALL EXIT CODE: ${install_status} =========="
          if [ "${install_status}" -ne 0 ]; then
            echo "========== POD INSTALL ERROR SUMMARY =========="
            grep -n -E "(Error|ERROR|error:|NoMethodError|undefined method|Invalid|Could not|Unable|cannot|not found|Unable to find a specification|HTTP2|HTTP/2|framing layer)" ../pod-install.log | tail -n 160 || true
            tail -n 300 ../pod-install.log || true
            exit "${install_status}"
          fi

      - name: Verify React Native source patch
        shell: bash
        run: |
          set -euo pipefail
          file="node_modules/react-native/React/Base/RCTBridge.mm"
          grep -q '#import "../DevSupport/RCTDevLoadingViewProtocol.h"' "$file"
          grep -q '#import "../DevSupport/RCTInspectorDevServerHelper.h"' "$file"
          echo "RCTBridge DevSupport imports are patched before Xcode build."

      - name: Verify Pods
        shell: bash
        run: |
          set -euxo pipefail
          test -d ios/Pods
          test -f ios/Podfile.lock
          grep -E "^(  - React-Core|  - RCT-Folly|  - Firebase|  - GoogleMaps)" ios/Podfile.lock || true

      - name: Verify React-Core integration mode
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'React-Core.*framework' ios/Pods/Manifest.lock 2>/dev/null; then
            echo "React-Core unexpectedly resolved as a framework."
            exit 1
          fi
          echo "React-Core is configured as a static library."

      - name: Verify RCT-Folly demangle patch
        run: |
          set -e
          file="ios/Pods/RCT-Folly/folly/Demangle.cpp"
          if [ ! -f "$file" ]; then
            echo "RCT-Folly Demangle.cpp not found: $file"
            exit 1
          fi
          if grep -q '#if false && __has_include(<demangle.h>)' "$file"; then
            echo "RCT-Folly demangle libiberty section successfully disabled."
          else
            echo "Expected RCT-Folly demangle patch was not applied."
            grep -n -E 'demangle.h|demangle_callbackref|cplus_demangle_v3_callback|DMGL_' "$file" | head -40 || true
            exit 1
          fi

      - name: Select available iPhone simulator
        id: simulator
        run: |
          set -e
          device=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 16/ {print $1; exit}' | xargs)
          if [ -z "$device" ]; then
            device=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $1; exit}' | xargs)
          fi
          if [ -z "$device" ]; then
            echo "No available iPhone simulator was found."
            exit 1
          fi
          echo "Using simulator: $device"
          echo "name=$device" >> "$GITHUB_OUTPUT"

      - name: Build for simulator
        run: |
          set -o pipefail
          export DEVELOPER_DIR="/Applications/Xcode_16.4.app/Contents/Developer"
          xcodebuild build \
            -workspace ios/CoffeeLoyalty.xcworkspace \
            -scheme CoffeeLoyalty \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          echo "========== XCODEBUILD EXIT CODE: ${status} =========="
          exit "${status}"

      - name: Diagnose build failure
        if: failure()
        run: |
          echo "========== ERROR SUMMARY =========="
          if [ -f xcodebuild.log ]; then
            grep -E "error:|fatal error:" xcodebuild.log | sort -u | head -80 || true
            echo "========== failing target =========="
            grep -n "error:" xcodebuild.log | tail -50 || true
          else
            echo "xcodebuild.log was not created; the failure occurred before the Xcode build step."
          fi
          if [ -f pod-install.log ]; then
            echo "========== POD INSTALL SUMMARY =========="
            grep -n -E "(Error|ERROR|error:|NoMethodError|undefined method|Invalid|Could not|Unable|cannot|not found|HTTP2|HTTP/2|framing layer)" pod-install.log | tail -100 || true
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          if-no-files-found: ignore
          path: |
            xcodebuild.log
            pod-install.log
            pod-install-1.log
            pod-install-2.log
            ios/Podfile.lock
