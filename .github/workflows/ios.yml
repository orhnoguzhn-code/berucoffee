name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build CoffeeLoyalty
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Xcode 26.4+
        shell: bash
        run: |
          set -euo pipefail
          DEVELOPER_DIR=""
          for candidate in \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.4.app; do
            if [ -d "$candidate" ]; then
              DEVELOPER_DIR="$candidate/Contents/Developer"
              break
            fi
          done
          if [ -z "$DEVELOPER_DIR" ]; then
            echo "No Xcode 26.4+ installation was found on this runner."
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -switch "$DEVELOPER_DIR"
          export DEVELOPER_DIR
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm install --no-audit --no-fund
          npx expo install --fix
          echo "Resolved dependency tree:"
          npm ls expo expo-modules-jsi expo-modules-core react-native react --depth=0

      - name: Patch React Native 0.86 legacy imports
        shell: bash
        run: |
          set -euo pipefail
          base="node_modules/react-native/React/Base/RCTBridge.mm"
          test -f "$base"
          perl -0pi -e 's/#import "RCTInspectorDevServerHelper\\.h"/#if RCT_ENABLE_INSPECTOR\n#import "..\\/DevSupport\\/RCTInspectorDevServerHelper.h"\n#endif/g' "$base"
          perl -0pi -e 's/#import "RCTDevLoadingViewProtocol\\.h"/#import "..\\/DevSupport\\/RCTDevLoadingViewProtocol.h"/g' "$base"

      - name: Clean native build state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios/Pods ios/Podfile.lock
          rm -rf build/DerivedData
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          sudo gem install cocoapods -v 1.16.2 --no-document
          GEM_BIN="$(ruby -e 'puts Gem.bindir')"
          echo "${GEM_BIN}" >> "$GITHUB_PATH"
          export PATH="${GEM_BIN}:${PATH}"
          pod --version

      - name: Install CocoaPods dependencies
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          pod _1.16.2_ install --clean-install --repo-update

      - name: Verify ExpoModulesJSI patch
        shell: bash
        run: |
          set -euo pipefail
          scheduler="node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h"
          test -f "$scheduler"
          if grep -Eq 'SWIFT_RETURNS_(RETAINED|UNRETAINED)' "$scheduler"; then
            echo "RuntimeScheduler ownership annotations remain after Podfile patch."
            exit 1
          fi
          echo "ExpoModulesJSI RuntimeScheduler patch verified."

      - name: Verify Pods
        shell: bash
        run: |
          set -euo pipefail
          test -d ios/Pods
          test -f ios/Podfile.lock
          grep -E "React-RCTAppDelegate|RNFBApp|RNFBAuth|RNFBMessaging" ios/Podfile.lock || true

      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -e
          device=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 17/ {print $1; exit}' | xargs)
          if [ -z "$device" ]; then
            device=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 16/ {print $1; exit}' | xargs)
          fi
          if [ -z "$device" ]; then
            device=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $1; exit}' | xargs)
          fi
          test -n "$device"
          echo "Using simulator: $device"
          echo "name=$device" >> "$GITHUB_OUTPUT"

      - name: Build for simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace ios/CoffeeLoyalty.xcworkspace \
            -scheme CoffeeLoyalty \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          echo "========== XCODEBUILD EXIT CODE: ${status} =========="
          exit "${status}"

      - name: Check Apple signing configuration
        id: signing_config
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          configured=true
          for value in BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 KEYCHAIN_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              configured=false
              echo "Missing signing secret: $value"
            fi
          done
          echo "configured=$configured" >> "$GITHUB_OUTPUT"

      - name: Install Apple signing assets
        id: signing
        if: ${{ steps.signing_config.outputs.configured == 'true' }}
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/build.mobileprovision"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PP_PATH" -o "$PROFILE_PLIST"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          TEAM_ID="${APP_ID%%.*}"
          BUNDLE_ID="${APP_ID#*.}"
          CERT_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Apple Distribution|iPhone Distribution/ {print $2; exit}')

          test -n "$PROFILE_NAME"
          test -n "$TEAM_ID"
          test -n "$BUNDLE_ID"
          test -n "$CERT_IDENTITY"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "CERT_IDENTITY=$CERT_IDENTITY" >> "$GITHUB_ENV"
          echo "Signing assets installed for $BUNDLE_ID"

      - name: Archive signed iOS app
        if: ${{ steps.signing.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -workspace ios/CoffeeLoyalty.xcworkspace \
            -scheme CoffeeLoyalty \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/CoffeeLoyalty.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CERT_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            2>&1 | tee xcodebuild-archive.log

      - name: Create IPA export options
        if: ${{ steps.signing.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ipa
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        if: ${{ steps.signing.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/CoffeeLoyalty.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa \
            2>&1 | tee xcodebuild-export.log
          test -f build/ipa/CoffeeLoyalty.ipa

      - name: Upload IPA
        if: ${{ steps.signing.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: CoffeeLoyalty-ipa
          if-no-files-found: error
          path: |
            build/ipa/CoffeeLoyalty.ipa
            build/CoffeeLoyalty.xcarchive

      - name: Explain missing signing configuration
        if: ${{ steps.signing_config.outputs.configured != 'true' }}
        shell: bash
        run: |
          echo "IPA export was skipped because Apple signing secrets are not configured."
          echo "Required GitHub repository secrets: BUILD_CERTIFICATE_BASE64, P12_PASSWORD, BUILD_PROVISION_PROFILE_BASE64, KEYCHAIN_PASSWORD."
          echo "The simulator build remains valid, but a real iPhone requires an Apple-signed archive and provisioning profile."

      - name: Diagnose build failure
        if: failure()
        shell: bash
        run: |
          echo "========== ERROR SUMMARY =========="
          if [ -f xcodebuild.log ]; then
            grep -E "error:|fatal error:" xcodebuild.log | sort -u | head -120 || true
          fi
          if [ -f xcodebuild-archive.log ]; then
            grep -E "error:|fatal error:" xcodebuild-archive.log | sort -u | head -120 || true
          fi
          if [ -f xcodebuild-export.log ]; then
            grep -E "error:|fatal error:" xcodebuild-export.log | sort -u | head -120 || true
          fi
          if [ -f ios/Podfile.lock ]; then
            echo "========== PODS =========="
            grep -E "React-RCTAppDelegate|RNFBApp|RNFBAuth|RNFBMessaging|expo-modules-jsi" ios/Podfile.lock || true
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          if-no-files-found: ignore
          path: |
            xcodebuild.log
            xcodebuild-archive.log
            xcodebuild-export.log
            ios/Podfile.lock
